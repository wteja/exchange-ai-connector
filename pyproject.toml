[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exchange-ai-connector"
version = "0.1.0"
description = "MCP server for human-gated email via Microsoft Graph"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "msal>=1.28",
    "httpx>=0.27",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exchange-ai-connector = "exchange_ai_connector.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
